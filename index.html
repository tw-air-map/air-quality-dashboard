    var dateMap = {}, others = [];

        }

        } else if (t.getAttribute('data-iso')) {

            if (dateMap[iso].length === 1) {

            } else {

                render();
            }
        } else if (t.getAttribute('data-name')) {
            window.openTab(t.getAttribute('data-name'));
        }
    });

    panel.addEventListener('change', function (e) {
        var role = e.target.getAttribute('data-role');

    });

    render();
